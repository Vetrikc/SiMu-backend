server:
  port: 8084
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS:400}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}

spring:
  application:
    name: music-service
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${MUSIC_DB_HOST:localhost}:${MUSIC_DB_PORT:5432}/${MUSIC_DB_NAME:simu_music}
    username: ${MUSIC_DB_USER:simu}
    password: ${MUSIC_DB_PASSWORD:simu}
    hikari:
      maximum-pool-size: ${MUSIC_DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

s3client:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-url: ${S3_PUBLIC_URL:http://localhost:9000}
  path-style: ${S3_PATH_STYLE:true}
  region: ${S3_REGION:us-east-1}
  bucket:
    music: ${S3_BUCKET:simu-music}
  accessKey: ${S3_ACCESS_KEY:simu}
  secretKey: ${S3_SECRET_KEY:simu-secret}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

services:
  internal-api-key: ${INTERNAL_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true