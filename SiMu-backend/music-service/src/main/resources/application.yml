server:
  port: 8084

spring:
  application:
    name: music-service
  datasource:
    url: jdbc:mysql://${MUSIC_DB_HOST:localhost}:${MUSIC_DB_PORT:3306}/${MUSIC_DB_NAME:simu_music}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${MUSIC_DB_USER:root}
    password: ${MUSIC_DB_PASSWORD:change_me}
    hikari:
      maximum-pool-size: ${MUSIC_DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

s3client:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-url: ${S3_PUBLIC_URL:http://localhost:9000}
  path-style: ${S3_PATH_STYLE:true}
  region: ${S3_REGION:us-east-1}
  bucket:
    music: ${S3_BUCKET:simu-music}
  accessKey: ${S3_ACCESS_KEY:simu}
  secretKey: ${S3_SECRET_KEY:simu-secret}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

services:
  internal-api-key: ${INTERNAL_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true