server:
  port: 8084

spring:
  application:
    name: music-service
  datasource:
    url: jdbc:mysql://${MUSIC_DB_HOST:localhost}:${MUSIC_DB_PORT:3306}/${MUSIC_DB_NAME:simu_music}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${MUSIC_DB_USER:root}
    password: ${MUSIC_DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

s3client:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:ru-1}
  bucket:
    music: ${S3_BUCKET:simu-music}
  accessKey: ${S3_ACCESS_KEY:minioadmin}
  secretKey: ${S3_SECRET_KEY:minioadmin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info