# Tests run on an in-memory database and never touch S3.
spring:
  datasource:
    url: jdbc:h2:mem:music_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-at-least-32-characters-long-for-hs256

s3client:
  endpoint: http://localhost:19000
  region: ru-1
  bucket:
    music: test-bucket
  accessKey: test
  secretKey: test
