# Unit tests: in-memory database and no S3 calls.
spring:
  datasource:
    url: jdbc:h2:mem:music_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false

jwt:
  secret: test-secret-at-least-32-characters-long-for-hs256

s3client:
  endpoint: http://localhost:19000
  public-url: http://localhost:19000
  path-style: true
  region: us-east-1
  bucket:
    music: test-bucket
  accessKey: test
  secretKey: test
services:
  internal-api-key: test-internal-key