server:
  port: 8085

spring:
  application:
    name: playlist-service
  datasource:
    url: jdbc:postgresql://${PLAYLIST_DB_HOST:localhost}:${PLAYLIST_DB_PORT:5432}/${PLAYLIST_DB_NAME:simu_playlist}
    username: ${PLAYLIST_DB_USER:simu}
    password: ${PLAYLIST_DB_PASSWORD:simu}
    hikari:
      maximum-pool-size: ${PLAYLIST_DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: playlist-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
    admin:
      fail-fast: false

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

services:
  internal-api-key: ${INTERNAL_API_KEY:}
  music-service:
    url: ${MUSIC_SERVICE_URL:http://localhost:8084}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true