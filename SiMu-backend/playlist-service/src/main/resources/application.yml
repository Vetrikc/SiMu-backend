server:
  port: 8085
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS:400}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}

spring:
  application:
    name: playlist-service
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${PLAYLIST_DB_HOST:localhost}:${PLAYLIST_DB_PORT:5432}/${PLAYLIST_DB_NAME:simu_playlist}
    username: ${PLAYLIST_DB_USER:simu}
    password: ${PLAYLIST_DB_PASSWORD:simu}
    hikari:
      maximum-pool-size: ${PLAYLIST_DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: playlist-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    admin:
      fail-fast: false

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

services:
  internal-api-key: ${INTERNAL_API_KEY:}
  music-service:
    url: ${MUSIC_SERVICE_URL:http://localhost:8084}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true