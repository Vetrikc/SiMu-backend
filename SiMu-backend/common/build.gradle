plugins {
    id 'java-library'
}

group = 'org.example.simu'
version = '1.0.0-SNAPSHOT'
description = 'Shared contracts: uuid v7, auditing base entity, kafka event payloads, migration mode'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Provided by every JPA service at runtime.
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    // Provided by every Spring Boot service at runtime; needed only to compile the migration hook.
    compileOnly 'org.springframework.boot:spring-boot:3.4.3'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.4.3'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
}
