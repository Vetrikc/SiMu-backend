worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    # max_fails=0: never eject a replica because of a single failed probe,
    # least_conn: send the next request to the replica with the fewest active connections
    upstream gateway {
        least_conn;
        server api-gateway:8081   max_fails=0;
        server api-gateway-2:8081 max_fails=0;
        server api-gateway-3:8081 max_fails=0;
        keepalive 256;
    }

    upstream music {
        least_conn;
        server music-service:8084   max_fails=0;
        server music-service-2:8084 max_fails=0;
        keepalive 256;
    }

    server {
        listen 8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        # catalogue reads are served by music replicas directly
        location /api/v1/music {
            proxy_pass http://music;
        }

        location / {
            proxy_pass http://gateway;
        }
    }
}
