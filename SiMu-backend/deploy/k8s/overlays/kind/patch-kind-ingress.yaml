---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simu
  namespace: simu
  annotations:
    cert-manager.io/cluster-issuer: null
spec:
  tls: null
  rules:
    - host: simu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { name: http }
