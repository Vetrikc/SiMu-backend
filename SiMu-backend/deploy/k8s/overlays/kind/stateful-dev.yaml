---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: simu
  labels: { app: auth-db, part-of: simu }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-db }
  template:
    metadata:
      labels: { app: auth-db, part-of: simu }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: simu-config, key: AUTH_DB_NAME } } }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: simu-secrets, key: AUTH_DB_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: simu-secrets, key: AUTH_DB_PASSWORD } } }
          ports: [{ containerPort: 5432 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: simu
spec:
  selector: { app: auth-db }
  ports: [{ port: 5432, targetPort: 5432 }]
