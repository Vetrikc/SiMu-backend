# Copy to secret.yaml, fill in real values and never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: simu-secrets
  namespace: simu
type: Opaque
stringData:
  AUTH_DB_USER: simu
  AUTH_DB_PASSWORD: change_me
  USER_DB_USER: simu
  USER_DB_PASSWORD: change_me
  MUSIC_DB_USER: simu
  MUSIC_DB_PASSWORD: change_me
  PLAYLIST_DB_USER: simu
  PLAYLIST_DB_PASSWORD: change_me
  JWT_SECRET: change_me_at_least_32_characters_long
  INTERNAL_API_KEY: change_me_at_least_32_characters_long
  S3_ACCESS_KEY: simu
  S3_SECRET_KEY: change_me
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URI: http://localhost:8081/api/v1/auth/oauth2/google/callback
  OAUTH_FRONTEND_REDIRECT_URI: http://localhost:8090/oauth2/callback
