---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: simu
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: simu
spec:
  selector: { app: auth-service }
  ports:
    - { name: http, port: 8082, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: simu
spec:
  selector: { app: user-service }
  ports:
    - { name: http, port: 8083, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: music-service
  namespace: simu
spec:
  selector: { app: music-service }
  ports:
    - { name: http, port: 8084, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: playlist-service
  namespace: simu
spec:
  selector: { app: playlist-service }
  ports:
    - { name: http, port: 8085, targetPort: http }
