server:
  port: 8083

spring:
  application:
    name: user-service

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8082}
  playlist-service:
    url: ${PLAYLIST_SERVICE_URL:http://localhost:8085}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info