server:
  port: 8083

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/${USER_DB_NAME:simu_user}
    username: ${USER_DB_USER:simu}
    password: ${USER_DB_PASSWORD:simu}
    hikari:
      maximum-pool-size: ${USER_DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
    admin:
      fail-fast: false

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8082}
  playlist-service:
    url: ${PLAYLIST_SERVICE_URL:http://localhost:8085}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
