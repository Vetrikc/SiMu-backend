pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets Gradle download a matching JDK when the machine has no Java 21 installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'SiMu-backend'

include 'common'
include 'api-gateway'
include 'auth-service'
include 'user-service'
include 'music-service'
include 'playlist-service'
