name: simu

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  music-db:
    image: postgres:16-alpine
    container_name: simu-music-db
    environment:
      POSTGRES_DB: ${MUSIC_DB_NAME}
      POSTGRES_USER: ${MUSIC_DB_USER}
      POSTGRES_PASSWORD: ${MUSIC_DB_PASSWORD}
    ports:
      - "${MUSIC_DB_EXPOSED_PORT:-5436}:5432"
    volumes:
      - music-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MUSIC_DB_USER} -d ${MUSIC_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  playlist-db:
    image: postgres:16-alpine
    container_name: simu-playlist-db
    environment:
      POSTGRES_DB: ${PLAYLIST_DB_NAME}
      POSTGRES_USER: ${PLAYLIST_DB_USER}
      POSTGRES_PASSWORD: ${PLAYLIST_DB_PASSWORD}
    ports:
      - "${PLAYLIST_DB_EXPOSED_PORT:-5437}:5432"
    volumes:
      - playlist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYLIST_DB_USER} -d ${PLAYLIST_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: simu-auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_EXPOSED_PORT:-5434}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    container_name: simu-user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_EXPOSED_PORT:-5435}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: simu-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local SMTP sink: verification / password-reset mails land here (UI http://localhost:8025).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: simu-mailhog
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"
      - "${MAIL_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: simu-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Local stand-in for S3. Docker Hub stopped publishing docker.io/minio/minio and quay.io
  # now requires a login, so the maintained Bitnami build of MinIO is used (same server, same
  # S3 API, same 9000/9001 ports).
  minio:
    image: bitnamilegacy/minio:latest
    container_name: simu-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
      MINIO_BROWSER: "on"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Creates the bucket (idempotent) and makes it public-read, so the browser can stream the
  # uploaded tracks straight from MinIO.
  minio-init:
    image: amazon/aws-cli:latest
    container_name: simu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1 || true
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$${S3_BUCKET}" > /tmp/policy.json
        aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket "$${S3_BUCKET}" --policy file:///tmp/policy.json
        echo "bucket $${S3_BUCKET} is ready"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args:
        MODULE_NAME: api-gateway
    container_name: simu-api-gateway
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_SIGNIN_PER_MINUTE: ${RATE_LIMIT_SIGNIN_PER_MINUTE:-5}
      RATE_LIMIT_SIGNUP_PER_MINUTE: ${RATE_LIMIT_SIGNUP_PER_MINUTE:-5}
      RATE_LIMIT_RECOVERY_PER_MINUTE: ${RATE_LIMIT_RECOVERY_PER_MINUTE:-3}
      RATE_LIMIT_REFRESH_PER_MINUTE: ${RATE_LIMIT_REFRESH_PER_MINUTE:-30}
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8083
      MUSIC_SERVICE_URL: http://music-service:8084
      PLAYLIST_SERVICE_URL: http://playlist-service:8085
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      music-service:
        condition: service_healthy
      playlist-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      args:
        MODULE_NAME: auth-service
    container_name: simu-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8082}:8082"
    environment:
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@simu.local
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/api/v1/auth/oauth2/google/callback}
      OAUTH_FRONTEND_REDIRECT_URI: ${OAUTH_FRONTEND_REDIRECT_URI:-http://localhost:5173/oauth/callback}
      OAUTH2_SECURE_COOKIE: ${OAUTH2_SECURE_COOKIE:-false}
      PLAYLIST_SERVICE_URL: http://playlist-service:8085
    depends_on:
      auth-db:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # signup asks playlist-service for the default playlist, so wait until it can answer
      playlist-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
      args:
        MODULE_NAME: user-service
    container_name: simu-user-service
    ports:
      - "${USER_SERVICE_PORT:-8083}:8083"
    environment:
      USER_DB_HOST: user-db
      USER_DB_PORT: 5432
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_SERVICE_URL: http://auth-service:8082
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  music-service:
    build:
      context: .
      dockerfile: music-service/Dockerfile
      args:
        MODULE_NAME: music-service
    container_name: simu-music-service
    ports:
      - "${MUSIC_SERVICE_PORT:-8084}:8084"
    environment:
      MUSIC_DB_HOST: music-db
      MUSIC_DB_PORT: 5432
      MUSIC_DB_NAME: ${MUSIC_DB_NAME}
      MUSIC_DB_USER: ${MUSIC_DB_USER}
      MUSIC_DB_PASSWORD: ${MUSIC_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_PATH_STYLE: "true"
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      music-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  playlist-service:
    build:
      context: .
      dockerfile: playlist-service/Dockerfile
      args:
        MODULE_NAME: playlist-service
    container_name: simu-playlist-service
    ports:
      - "${PLAYLIST_SERVICE_PORT:-8085}:8085"
    environment:
      PLAYLIST_DB_HOST: playlist-db
      PLAYLIST_DB_PORT: 5432
      PLAYLIST_DB_NAME: ${PLAYLIST_DB_NAME}
      PLAYLIST_DB_USER: ${PLAYLIST_DB_USER}
      PLAYLIST_DB_PASSWORD: ${PLAYLIST_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MUSIC_SERVICE_URL: http://music-service:8084
    depends_on:
      playlist-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

volumes:
  music-db-data:
  playlist-db-data:
  auth-db-data:
  user-db-data:
  redis-data:
  kafka-data:
  minio-data: