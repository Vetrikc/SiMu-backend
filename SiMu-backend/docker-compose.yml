name: simu

services:
  mysql:
    image: mysql:8.0
    container_name: simu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args:
        MODULE_NAME: api-gateway
    container_name: simu-api-gateway
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8083
      MUSIC_SERVICE_URL: http://music-service:8084
      PLAYLIST_SERVICE_URL: http://playlist-service:8085
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      music-service:
        condition: service_healthy
      playlist-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      args:
        MODULE_NAME: auth-service
    container_name: simu-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8082}:8082"
    environment:
      AUTH_DB_HOST: mysql
      AUTH_DB_PORT: 3306
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: root
      AUTH_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      PLAYLIST_SERVICE_URL: http://playlist-service:8085
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
      args:
        MODULE_NAME: user-service
    container_name: simu-user-service
    ports:
      - "${USER_SERVICE_PORT:-8083}:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8082
      PLAYLIST_SERVICE_URL: http://playlist-service:8085
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  music-service:
    build:
      context: .
      dockerfile: music-service/Dockerfile
      args:
        MODULE_NAME: music-service
    container_name: simu-music-service
    ports:
      - "${MUSIC_SERVICE_PORT:-8084}:8084"
    environment:
      MUSIC_DB_HOST: mysql
      MUSIC_DB_PORT: 3306
      MUSIC_DB_NAME: ${MUSIC_DB_NAME}
      MUSIC_DB_USER: root
      MUSIC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  playlist-service:
    build:
      context: .
      dockerfile: playlist-service/Dockerfile
      args:
        MODULE_NAME: playlist-service
    container_name: simu-playlist-service
    ports:
      - "${PLAYLIST_SERVICE_PORT:-8085}:8085"
    environment:
      PLAYLIST_DB_HOST: mysql
      PLAYLIST_DB_PORT: 3306
      PLAYLIST_DB_NAME: ${PLAYLIST_DB_NAME}
      PLAYLIST_DB_USER: root
      PLAYLIST_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MUSIC_SERVICE_URL: http://music-service:8084
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
