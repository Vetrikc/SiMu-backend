# Unit tests: in-memory database, no Kafka/Redis/SMTP required.
spring:
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cache:
    type: simple
  mail:
    host: localhost
    port: 1025
  kafka:
    bootstrap-servers: localhost:19092
    admin:
      fail-fast: false

jwt:
  secret: test-secret-at-least-32-characters-long-for-hs256
  access-expiration-ms: 3600000
  refresh-expiration-ms: 2592000000

app:
  public-url: http://localhost:5173
  mail:
    from: no-reply@simu.local
    enabled: false

services:
  internal-api-key: test-internal-key
  playlist-service:
    url: http://localhost:18085