server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:simu_auth}
    username: ${AUTH_DB_USER:simu}
    password: ${AUTH_DB_PASSWORD:simu}
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    admin:
      fail-fast: false

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000000}

outbox:
  publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:1000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

services:
  playlist-service:
    url: ${PLAYLIST_SERVICE_URL:http://localhost:8085}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
