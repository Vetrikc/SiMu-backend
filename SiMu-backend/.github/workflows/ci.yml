name: ci

on:
  push:
    branches: [main, develop, feature-microservices]
  pull_request:

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest --no-daemon
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: '**/build/reports/tests/integrationTest'

  images:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [api-gateway, auth-service, user-service, music-service, playlist-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          build-args: MODULE_NAME=${{ matrix.module }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/simu-${{ matrix.module }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render manifests with the commit tag
        run: |
          curl -sLo kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar -xzf kustomize.tgz
          owner=${{ github.repository_owner }}
          owner=${owner,,}
          for module in api-gateway auth-service user-service music-service playlist-service; do
            ./kustomize edit set image "ghcr.io/vetrikc/simu-${module}:latest" "ghcr.io/${owner}/simu-${module}:${{ github.sha }}"
          done
          ./kustomize build . > /dev/null
          ./kustomize build ../../overlays/kind > /dev/null
        working-directory: deploy/k8s/base