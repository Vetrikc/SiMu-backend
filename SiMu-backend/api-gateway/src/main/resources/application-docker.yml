server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}

auth-service:
  url: ${AUTH_SERVICE_URL:http://auth-service:8082}

user-service:
  url: ${USER_SERVICE_URL:http://user-service:8083}

music-service:
  url: ${MUSIC_SERVICE_URL:http://music-service:8084}

playlist-service:
  url: ${PLAYLIST_SERVICE_URL:http://playlist-service:8085}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s

gateway:
  rate-limit:
    signin-per-minute: ${RATE_LIMIT_SIGNIN_PER_MINUTE:5}
    signup-per-minute: ${RATE_LIMIT_SIGNUP_PER_MINUTE:5}
    recovery-per-minute: ${RATE_LIMIT_RECOVERY_PER_MINUTE:3}
    refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true