spring.application.name=SiMu-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/SiMu_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

s3client.endpoint=${S3_ENDPOINT}
s3client.bucket.music=${S3_BUCKET}
s3client.accessKey=${S3_ACCESS_KEY}
s3client.secretKey=${S3_SECRET_KEY}

testing.app.secret=${JWT_SECRET:replace_with_a_long_random_secret}
testing.app.expirationMs=3600000000000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.csrf.enabled=false
